version: '3.8'

services:
  # 1. The Web Server
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # 2. The PHP Engine
  php:
    image: php:8.3-fpm
    volumes:
      - ./:/var/www/html
    # This installs the MySQL driver so PHP can talk to the database later
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql && php-fpm"

  # 3. The Database Vault
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: l_ecole
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

# Start it with docker compose up -d
services:
  db:
    image: mysql:8.0
    ports:
      - "3308:3306"        # Port 3308 on this computer
    environment:
      MYSQL_DATABASE: l_ecole
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql  # Only runs the first time the database starts
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  phpmyadmin:              # Open at http://localhost:8086
    image: phpmyadmin/phpmyadmin
    ports:
      - "8086:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
